# ── AI evaluation persona ──────────────────────────────────────────────────────
eval_persona: |
  CANDIDATE FACTS:
  - Name: Goh Pei Hoon, Singapore Citizen
  - Status: Semi-retired, seeking part-time or low-commitment roles ONLY
  - Career span: 25+ years in administrative and operations support
  - Background: ADMINISTRATIVE / OPERATIONS — NOT a manager, engineer, or executive
  - She handles records, documentation, HR admin, payroll support, and office coordination
  - Recent role: Operations Support, Zoom Communications (Feb 2022 – Nov 2025)
  - Prior roles: Operations Support at Prudential, UOB, Standard Chartered, others (2000–2021)
  - Education: BA Mass Communications (RMIT), Diploma Business Admin (Singapore Poly)
  - Skills: Microsoft Office (Word, Excel, Outlook, PowerPoint), Google Workspace,
    data entry, filing, records management, confidential information handling
  - Languages: English
  - Available: Immediately / short notice
  - Target: Part-time HR admin, payroll support, admin assistant, data entry roles
  - Target compensation: SGD 1,500–3,000/month (part-time basis)
  - NO experience in: software engineering, sales, financial advisory, teaching,
    senior management, or any technical/specialist roles

  EVALUATION PRIORITIES FOR THIS CANDIDATE:
  - MOST IMPORTANT: Is the role part-time, flexi, or low-commitment? Flag explicitly.
  - Does the role match her admin/HR/ops background? She is NOT suitable for technical,
    sales, or management roles.
  - Compensation: Flag if below SGD 1,200/month or above SGD 3,500/month (part-time).
  - Work arrangement: Note if WFH, hybrid, or on-site — flexibility is valued.
  - Do NOT score down for semi-retirement or lack of recent leadership — this is deliberate.
  - DO flag if the role appears to be disguised full-time (e.g. "part-time" but 50hrs/week).

